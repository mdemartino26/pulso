name: CI

on:
  pull_request:
  push:
    branches: [main]

# Mínimo privilegio: el workflow solo puede leer el repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Falla si hay vulnerabilidades altas o críticas en dependencias de producción.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          # Valores de ejemplo: el build no se conecta a Supabase.
          NEXT_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ejemplo_para_ci
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  database:
    # Aplica las migraciones en un Postgres limpio y corre los tests de RLS.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - run: scripts/test-db.sh
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/postgres
